name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.pio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.18 esptool==4.5.1
      - run: pio run -e cardputer-universal -e cardputer-adv
      - run: cmake -S . -B build && cmake --build build -j 2 && ctest --test-dir build --output-on-failure
      - run: cmake -S . -B build-sanitized -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" && cmake --build build-sanitized -j 2 && ctest --test-dir build-sanitized --output-on-failure
      - run: python -m unittest discover -s tools -p 'test_package_firmware.py'
      - run: python tools/package_firmware.py --version 1.0 --output dist/M5Chord-v1.0
