name: Build firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.pio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.18 esptool==4.5.1
      - run: pio run -e cardputer-universal -e cardputer-adv -e cardputer-diagnostics
      - run: python tools/package_firmware.py --output dist/M5Chord-current
